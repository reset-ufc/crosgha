[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# release-please (not cargo-dist) owns tagging and the GitHub Release: it
# creates a draft release, then dispatches this release CI. See RELEASING.md.
dispatch-releases = true
create-release = false
# release.yml is hand-hardened after `dist generate` (SHA-pinned actions,
# minimal per-job permissions, timeouts, concurrency) — see RELEASING.md.
allow-dirty = ["ci"]
