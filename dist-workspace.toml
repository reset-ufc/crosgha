[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-musl"]
# release-please (not cargo-dist) owns tagging and the GitHub Release: it
# creates a draft release, then dispatches this release CI.
dispatch-releases = true
create-release = false
# release.yml is hand-hardened after `dist generate` (SHA-pinned actions, dist
# installed from its release asset by sha256, minimal per-job permissions,
# timeouts, concurrency, workflow_dispatch only).
allow-dirty = ["ci"]
# One archive plus a single sha256.sum (written by release.yml):
# GitHub already attaches the source archives and shows each asset's digest.
source-tarball = false
checksum = "false"
