[package]
name = "crosgha"
version = "0.21.0"
edition = "2024"
rust-version = "1.97.0"
description = "GitHub Actions workflow smell tool"
repository = "https://github.com/reset-ufc/crosgha"
license = "Apache-2.0"
publish = false

[[bin]]
name = "crosgha"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

# The rules of docs/rust-style.md that clippy can check beyond its defaults.
[lints.clippy]
fn_params_excessive_bools = "warn"
format_push_string = "warn"
implicit_clone = "warn"
missing_assert_message = "warn"
missing_panics_doc = "warn"
needless_for_each = "warn"
ref_option = "warn"
string_add = "warn"
wildcard_imports = "warn"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "env"] }
yamlpath = "=1.31.1"
yamlpatch = "=1.31.1"
yaml_serde = "=0.10.7"
ureq = { version = "3.4.2", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# publish = false hides the binary from dist by default; opt back in.
[package.metadata.dist]
dist = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
# The Action downloads this binary on every run.
codegen-units = 1
strip = true
