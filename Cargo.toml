[package]
name = "crosgha"
version = "0.14.0"
edition = "2024"
rust-version = "1.97.0"
description = "GitHub Actions workflow smell tool"
repository = "https://github.com/meiazero/crosgha"
publish = false

[[bin]]
name = "crosgha"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
yamlpath = "=1.30.1"
yamlpatch = "=1.30.1"
yaml_serde = "=0.10.7"
ureq = { version = "3.4.2", features = ["json"] }
serde_json = "1.0.151"

# publish = false hides the binary from dist by default; opt back in.
[package.metadata.dist]
dist = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
