[package]
name = "smell-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
description = "GitHub Actions workflow smell tool"
# TODO: replace with the real GitHub URL once the repo is created (see RELEASING.md).
repository = "https://github.com/meiazero/tool-smell-hunter"
publish = false

[[bin]]
name = "smell-tool"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
yamlpath = "=1.30.1"
yamlpatch = "=1.30.1"

# publish = false hides the binary from dist by default; opt back in.
[package.metadata.dist]
dist = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
