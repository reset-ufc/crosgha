name: Online
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release:
    uses: example/archived-workflows/.github/workflows/release.yml@v2 # expect: archived-action
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: example/abandoned-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4 # expect: archived-action
      - uses: example/unknown@v1
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
