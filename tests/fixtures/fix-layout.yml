# 构建文档并发布到 pages 分支
name: Docs
on: [push]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # 首先安装依赖
      - run: npm ci
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm run build
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
