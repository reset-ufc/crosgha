name: Environment file writes
on: [issues]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo "NUMBER=${{ github.event.issue.number }}" >> "$GITHUB_ENV"
      - run: |
          cat >> "$GITHUB_ENV" <<EOF
          NUMBER=${{ github.event.issue.number }}
          EOF
      - shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "NUMBER=${{ github.event.issue.number }}"
      - run: echo "$GITHUB_ENV" > debug.txt
