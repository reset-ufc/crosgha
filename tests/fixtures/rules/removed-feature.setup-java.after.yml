name: Java
on: [push]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v6 # expect: removed-feature
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v6.1.0 # expect: removed-feature
        with:
          distribution: semeru
          java-version: 21
      - uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 11
