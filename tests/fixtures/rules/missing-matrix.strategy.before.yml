name: CI
on: pull_request
permissions: {}
jobs: # expect: missing-matrix
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: npm run lint
  test:
    strategy:
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: npm test
