name: Low-trust cache
on:
  pull_request_target:
cache-mode: write # expect: cache-poisoning
permissions: {}
jobs:
  build:
    cache-mode: write-only # expect: cache-poisoning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo build
  lint:
    cache-mode: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo lint
