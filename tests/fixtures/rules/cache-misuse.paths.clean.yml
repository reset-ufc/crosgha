name: Cache paths
on: [push]
permissions: {}
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with: { cache: pip }
