name: Shell, unfixable
on: [push]
permissions: {}
jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The rule counts double quotes on the line, but the shell reads these paths as text:
      # single quotes, an escaped `$`, a comment, a heredoc body, and a string spanning lines.
      - run: echo 'echo "a=1" >> $GITHUB_ENV' > setup.sh # expect: embedded-script-lint
      - run: echo \$GITHUB_OUTPUT # expect: embedded-script-lint
      - run: | # expect: embedded-script-lint
          # Appends to $GITHUB_ENV
          echo "a=1" >> "$GITHUB_ENV"
      - run: | # expect: embedded-script-lint
          cat <<EOF > notes.txt
          Outputs go to $GITHUB_OUTPUT
          EOF
      - run: | # expect: embedded-script-lint
          bash -c "
          echo a=1 >> $GITHUB_ENV
          "
      # Backticks and `$'...'` quoting are not followed.
      - run: lines=`wc -l < $GITHUB_ENV` # expect: embedded-script-lint
      - run: printf $'a=1\n' >> $GITHUB_ENV # expect: embedded-script-lint
      # YAML folds `>` scalars and unescapes quoted ones, so the source is not the script.
      - run: > # expect: embedded-script-lint
          echo "a=1" >> $GITHUB_ENV
      - run: "echo \"a=1\" >> $GITHUB_ENV" # expect: embedded-script-lint
      # In a flow mapping, the braces of `${GITHUB_ENV}` would end the plain scalar.
      - {run: echo a=1 >> $GITHUB_ENV} # expect: embedded-script-lint
      # Only redirect targets are quoted. Elsewhere quoting can change what the script does: with
      # GITHUB_OUTPUT='f*', the `for` list globs and the patterns match `foo` only unquoted.
      - run: | # expect: embedded-script-lint
          echo "a=1" >> $GITHUB_ENV
          if [ -f $GITHUB_PATH ]; then cat $GITHUB_PATH; fi
      - run: | # expect: embedded-script-lint
          for file in $GITHUB_OUTPUT; do echo "$file"; done
      - run: | # expect: embedded-script-lint
          while read -r line; do echo "$line"; done < $GITHUB_ENV
      - run: | # expect: embedded-script-lint
          case foo in
            bar) echo esac ;;
            $GITHUB_OUTPUT) echo matched >> $GITHUB_STEP_SUMMARY ;;
          esac
      - run: | # expect: embedded-script-lint
          [[ foo == $GITHUB_OUTPUT ]] && echo matched
      - run: | # expect: embedded-script-lint
          [[ foo = $GITHUB_OUTPUT || -f $GITHUB_ENV ]] && echo matched
      - run: | # expect: embedded-script-lint
          [[ $file =~ $GITHUB_ENV ]] && echo matched
      - run: | # expect: embedded-script-lint
          case foo in $GITHUB_OUTPUT) echo matched;; esac
      - run: | # expect: embedded-script-lint
          case $GITHUB_ENV in
            /tmp/*) echo temporary ;;
          esac
      - run: echo "${file#$GITHUB_ENV}" > out.txt; echo ${file%$GITHUB_ENV} # expect: embedded-script-lint
      - run: echo ${GITHUB_ENV:-$GITHUB_OUTPUT} # expect: embedded-script-lint
      # One path left as text leaves the whole step unfixed.
      - run: | # expect: embedded-script-lint
          echo "a=1" >> $GITHUB_ENV
          echo 'b=$GITHUB_ENV' >> "$GITHUB_ENV"
