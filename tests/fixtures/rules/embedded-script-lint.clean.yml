name: Shell
on: [push]
permissions: {}
jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo "a=1" >> "$GITHUB_ENV"
      - run: echo "b=2" >> "$GITHUB_OUTPUT"
      - run: |
          echo "## Summary" >> "${GITHUB_STEP_SUMMARY}"
      - shell: pwsh
        run: echo "c=3" >> $env:GITHUB_ENV
      - shell: /usr/bin/bash -e {0}
        run: echo "d=4" >> "$GITHUB_ENV"
      - shell: /bin/sh -eu {0}
        run: echo "e=5" >> "$GITHUB_OUTPUT"
