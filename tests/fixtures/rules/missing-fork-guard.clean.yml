name: Nightly
on:
  schedule:
    - cron: '0 3 * * *'
permissions: {}
jobs:
  nightly:
    if: github.repository == 'example/project'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  publish:
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make publish
  report:
    needs: publish
    if: ${{ always() && github.repository == 'example/project' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make report
