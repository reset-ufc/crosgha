name: Permissions through a reusable workflow
on: [push]
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo image
  ci:
    needs: image
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
