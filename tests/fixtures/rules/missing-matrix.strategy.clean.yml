name: CI
on: pull_request
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.list }}
    steps:
      - id: versions
        run: echo 'list=["20","22","24"]' >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: npm test
