name: Environment file writes
on: [issues]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo "TITLE=${{ github.event.issue.title }}" >> "$GITHUB_ENV" # expect: github-env-injection
      - run: echo "NUMBER=${{ github.event.issue.number }}" >> "$GITHUB_ENV"
      - run: echo "TITLE=${{ github.event.issue.title }}" | tee -a "$GITHUB_ENV" # expect: github-env-injection
      - run: | # expect: github-env-injection
          cat >> "$GITHUB_ENV" <<'EOF'
          NUMBER=${{ github.event.issue.number }}
          TITLE=${{ github.event.issue.title }}
          EOF
      - run: | # expect: github-env-injection
          {
            echo "NUMBER=${{ github.event.issue.number }}"
            echo "BODY<<END"
            echo "${{ github.event.issue.body }}"
            echo "END"
          } >> "${GITHUB_ENV}"
      - run: | # expect: github-env-injection
          for label in ${{ join(github.event.issue.labels.*.name, ' ') }}; do
            echo "LABEL_$label=1"
          done >> $GITHUB_ENV
      - shell: pwsh
        run: | # expect: github-env-injection
          "TITLE=${{ github.event.issue.title }}" | Out-File -FilePath $env:GITHUB_ENV -Append
      - shell: pwsh
        run: | # expect: github-env-injection
          Add-Content -Path $Env:GITHUB_PATH -Value "${{ github.event.issue.title }}"
      # The untrusted value is outside the write: a different step, line, or heredoc.
      - shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "NUMBER=${{ github.event.issue.number }}"
      - run: |
          echo "${{ github.event.issue.title }}" > title.txt
          cat >> "$GITHUB_ENV" <<EOF
          NUMBER=${{ github.event.issue.number }}
          EOF
          echo "${{ github.event.issue.body }}" > body.txt
      - run: |
          echo "$GITHUB_ENV ${{ github.event.issue.title }}" > debug.txt
          echo "NUMBER=${{ github.event.issue.number }}" >> "$GITHUB_ENV"
      # The untrusted value reaches the write through an environment variable.
      - env:
          TITLE: ${{ github.event.issue.title }}
        run: echo "TITLE=$TITLE" >> "$GITHUB_ENV" # expect: github-env-injection
      - shell: python
        env:
          TITLE: ${{ github.event.issue.title }}
        run: | # expect: github-env-injection
          import os
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TITLE={os.environ['TITLE']}\n")
      # `github.env` names the same file, and `>|` truncates it like `>`.
      - run: echo "TITLE=${{ github.event.issue.title }}" >> ${{ github.env }} # expect: github-env-injection
      - run: echo "TITLE=${{ github.event.issue.title }}" >| "$GITHUB_ENV" # expect: github-env-injection
      - env:
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: echo "NUMBER=$NUMBER" >> "$GITHUB_ENV"
      - shell: python
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          import os
          print(open(os.environ["GITHUB_ENV"]).read(), os.environ["TITLE"])
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BODY: ${{ github.event.issue.body }}
    steps:
      - run: echo "BODY=${BODY}" >> "$GITHUB_ENV" # expect: github-env-injection
      - env:
          BODY: fixed
        run: echo "BODY=${BODY}" >> "$GITHUB_ENV"
