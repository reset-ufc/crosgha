name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - run: make lint
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - run: make test
