name: Nightly
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  report:
    if: github.event_name == 'schedule' && github.repository == 'example/project'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make report
  publish:
    if: ${{ github.repository == 'example/project' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make publish
  audit:
    if: github.repository_owner == 'example'
    uses: ./.github/workflows/audit.yml
