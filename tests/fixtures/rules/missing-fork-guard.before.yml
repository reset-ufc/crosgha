name: Nightly
on:
  schedule:
    - cron: '0 3 * * *'
permissions: {}
jobs:
  nightly: # expect: missing-fork-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  guarded:
    if: github.repository == 'example/project'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  owner-guarded:
    if: ${{ github.repository_owner == 'example' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  fork-flag-guarded:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  full-name-guarded:
    if: github.event.repository.full_name == 'example/project'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  publish:
    needs: guarded
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make publish
  announce:
    needs: [nightly, publish]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make announce
  report: # expect: missing-fork-guard
    needs: guarded
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make report
  cleanup: # expect: missing-fork-guard
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make cleanup
  mixed-case-guarded:
    if: GitHub.Repository == 'example/project'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  reversed-guarded:
    if: ${{ 'example/project' == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  fork-flag-false:
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  schedule-or-success: # expect: missing-fork-guard
    needs: guarded
    if: success() || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  fork-only: # expect: missing-fork-guard
    if: github.repository != 'example/project'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  not-fork-flag: # expect: missing-fork-guard
    if: github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  negated-guard: # expect: missing-fork-guard
    if: ${{ !(github.repository == 'example/project') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
  negated-fork-only:
    if: ${{ !(github['repository'] != 'example/project') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: make nightly
