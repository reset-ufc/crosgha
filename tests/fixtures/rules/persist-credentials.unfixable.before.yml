name: Checkout credentials a later step needs
on: [push]
permissions: { contents: write }
# Every finding here stays unfixed: `persist-credentials: false` would break a later push, the
# workflow asked for the token explicitly, or the checkout version has no such input.
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # expect: persist-credentials
        with:
          persist-credentials: true
      - run: |
          git commit --allow-empty -m bump
          git push origin HEAD
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # expect: persist-credentials
        with:
          persist-credentials: true # Kept on purpose for the deploy script.
      - run: make docs
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # expect: persist-credentials
        with:
          fetch-depth: 0
      - run: make changelog
      - name: Tag
        run: git tag "v$VERSION" && git -C . -c core.hooksPath=/dev/null push --tags
        env:
          VERSION: 1.2.3
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # expect: persist-credentials
      - run: make site
      - parallel:
          - run: make check-links
          - name: Publish
            run: |
              cd site
              GIT_TRACE=1 sudo git push origin HEAD:gh-pages
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # expect: persist-credentials
      - run: cargo fmt
      # Its README: "`persist-credentials` in `actions/checkout` must be set to `true` to push".
      - uses: stefanzweifel/git-auto-commit-action@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v1 # expect: persist-credentials
      - run: make
  legacy-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # v1.2.0 # expect: persist-credentials
      - run: make
