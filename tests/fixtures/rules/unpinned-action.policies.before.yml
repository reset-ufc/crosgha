name: Configured
on:
  push:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/save@v4
      - uses: github/codeql-action/init@v3 # expect: unpinned-action
      - uses: github/codeql-action/analyze@v3 # expect: unpinned-action
      - uses: example/trusted@main
      - uses: other/thing@v1 # expect: unpinned-action
      - uses: other/pinned@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
