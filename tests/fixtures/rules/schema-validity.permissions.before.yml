name: Permissions
on: [push]
permissions:
  contents: read
  pull-request: write # expect: schema-validity
  issues: wirte # expect: schema-validity
jobs:
  label:
    permissions:
      issues: write
      models: read
      contents: admin # expect: schema-validity
      id-token: read # expect: schema-validity
      id_token: write # expect: schema-validity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo label
  report:
    permissions:
      artifact-metadata: write
      attestations: write
      code-quality: write
      vulnerability-alerts: read
      security-event: write # expect: schema-validity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo report
  everything:
    permissions: read-all
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo read
  shorthand:
    permissions: write # expect: schema-validity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo write
  alerts:
    permissions:
      vulnerability-alerts: write # expect: schema-validity
      statuses: none
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo alerts
  release:
    permissions:
      content: write # expect: schema-validity
    uses: ./.github/workflows/release.yml
  ai:
    permissions:
      models: write # expect: schema-validity
      copilot-requests: write
      drives: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo ai
  copilot:
    permissions:
      copilot-requests: read # expect: schema-validity
      drives: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo copilot
