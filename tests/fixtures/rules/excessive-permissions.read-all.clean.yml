name: Read everything
on: [push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo build
  scan:
    permissions:
      contents: read
      security-events: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo scan
