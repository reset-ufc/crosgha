name: Checks
on: [push]
permissions: {}
# Linters and link checkers do not depend on the OS or toolchain version, so one runner is enough.
jobs:
  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: typos
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: lychee --no-progress "**/*.md"
      - run: npm i -g markdownlint-cli@0.42.0 && markdownlint "**/*.md" --ignore latest
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: test -f CHANGELOG.md
      - run: |
          if test -n "$(git status --porcelain)"; then exit 1; fi
          [ -s dist/index.js ] && ! test -L dist/index.js
      # Conditions that name a tests directory and installs of test tools run no tests.
      - run: test -d tests || mkdir build
      - run: if [ -d tests/fixtures ]; then make fixtures; fi
      - run: pip install pytest==8.0.0 tox==4.18.0
      - run: npm i -D jest@29.7.0
