name: Set up the project
description: Checks out the code and installs Node.js and Python.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
