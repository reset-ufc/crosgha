name: Test
description: Installs Python, restores the cache, and runs the tests.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    - uses: ./.github/actions/cache
    - name: Test
      shell: bash
      run: python -m pytest
