name: CI
on:
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: stable
      - uses: ./.github/actions/node
      # Missing locally, or a symbolic link to `setup` in tests/cli.rs.
      - uses: ./.github/actions/alias
      - uses: ./.github/actions/missing
      # A Docker action defined by its Dockerfile alone has no metadata file.
      - uses: ./docker
      - name: Test
        run: make test
