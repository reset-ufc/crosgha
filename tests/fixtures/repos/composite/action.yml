# The action this repository publishes; it is scanned with the repository and has no findings.
name: Example deploy
description: Builds the site and deploys it to the given environment.
inputs:
  environment:
    description: Environment to deploy to.
    required: true
  dry-run:
    description: Build without deploying.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: make site
    - name: Deploy
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: ./deploy.sh "$ENVIRONMENT"
