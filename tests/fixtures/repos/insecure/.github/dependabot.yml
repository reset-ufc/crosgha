version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions # expect: missing-release-cooldown
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm # expect: missing-release-cooldown
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
