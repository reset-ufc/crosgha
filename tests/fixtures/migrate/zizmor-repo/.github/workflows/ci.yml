name: Security
on:
  push:
    branches: [main]
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6.1.0
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pip install zizmor==1.30.0
      - name: Run zizmor
        run: uvx zizmor --pedantic --offline --min-severity medium --format plain .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report
        run: |
          zizmor --format sarif . > results.sarif
          cat results.sarif
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6.1.0
        with:
          persist-credentials: false
      - name: Lint
        run: pip install zizmor ruff
      - run: ruff check .
      - name: Build
        run: pip install zizmor && npm ci && npm run build
      - name: Audit for the dashboard
        run: zizmor --format=json .
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6.1.0
        with:
          persist-credentials: false
      - name: Install zizmor
        run: sudo pip install --quiet zizmor==1.30.0
      - run: zizmor --persona=auditor .
