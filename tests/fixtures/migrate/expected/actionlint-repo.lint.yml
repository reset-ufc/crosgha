name: Lint
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6.1.0
        with:
          persist-credentials: false
      - name: Check workflow files
        uses: meiazero/crosgha@cccccccccccccccccccccccccccccccccccccccc # v0.1.0
        with:
          advanced-security: 'false'
