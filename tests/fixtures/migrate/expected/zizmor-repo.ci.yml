name: Security
on:
  push:
    branches: [main]
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6.1.0
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pip install zizmor==1.30.0
      - name: Run zizmor
        uses: reset-ufc/crosgha@cccccccccccccccccccccccccccccccccccccccc # v0.1.0
        with:
          inputs: .github/workflows
          persona: pedantic
          min-severity: medium
          online-audits: 'false'
          advanced-security: 'false'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report
        run: |
          zizmor --format sarif . > results.sarif
          cat results.sarif
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6.1.0
        with:
          persist-credentials: false
      - name: Lint
        run: pip install zizmor ruff
      - run: ruff check .
      - name: Build
        run: pip install zizmor && npm ci && npm run build
      - name: Audit for the dashboard
        run: zizmor --format=json .
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6.1.0
        with:
          persist-credentials: false
      - uses: reset-ufc/crosgha@cccccccccccccccccccccccccccccccccccccccc # v0.1.0
        with:
          persona: auditor
          advanced-security: 'false'
  chained:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: zizmor .; echo done
      - run: uvx zizmor --persona pedantic . 2>/dev/null
      - run: zizmor $(ls .github/workflows/*.yml)
  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: pip install zizmor
      - run: pre-commit run --all-files
