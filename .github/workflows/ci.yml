name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A running master push is never canceled, but a newer push still replaces one that is pending:
  # a group holds one pending run, whatever cancel-in-progress says. Superseded PR runs are canceled.
  # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fmt, clippy, test, dogfood, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain (mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.14
          sha256: 2b289d1b3074e0b1d3f95bad0bd78bbc517c1a5bcb020cbc1643d260f5d1a351

      # Exact-key hits skip the save, so source-only changes reuse the dependency build; a
      # Cargo.lock or toolchain change starts a new entry from the closest prefix.
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('mise.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Scan workflows with crosgha
        run: cargo run -- --offline --persona pedantic .github/workflows

      - name: Build release
        run: cargo build --release
