# release-please owns tagging and the (draft) GitHub Release; it then
# dispatches release.yml (cargo-dist, dispatch-releases=true, create-release=
# false) to build the 3 target binaries and undraft that same release. See
# RELEASING.md for why this two-workflow, workflow_dispatch design was chosen.
name: release-please

permissions: {}

on:
  push:
    branches: [master]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit version bump/CHANGELOG, tag, create the draft GitHub Release
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dispatch-dist-release:
    name: dispatch cargo-dist release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # required to trigger release.yml via workflow_dispatch
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # --ref is the tag, not master: the build must use the tagged commit even if master moved on.
      - name: Dispatch cargo-dist release workflow
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
